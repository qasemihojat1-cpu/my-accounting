<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسابداری شخصی من</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

    <style>
        :root {
            --primary: #142b4a;
            --primary-hover: #0d2039;
            --primary-soft: #eaf0f6;
            --secondary: #168566;
            --secondary-hover: #0f6b51;
            --secondary-soft: #e8f5ef;
            --bg-color: #f3f6f8;
            --surface: #ffffff;
            --text-main: #17283d;
            --text-muted: #718096;
            --border: #e0e7ed;
            --input-bg: #f8fafb;
            --danger: #c94d55;
            --shadow: 0 18px 48px rgba(20, 43, 74, .08);
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; background: var(--bg-color); }
        body {
            min-height: 100vh; font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: radial-gradient(ellipse at top right, rgba(22,133,102,.07), transparent 34%),
                        radial-gradient(ellipse at bottom left, rgba(20,43,74,.06), transparent 36%), var(--bg-color);
            margin: 0; padding: 34px 16px; color: var(--text-main); line-height: 1.75;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            position: relative; width: 100%; max-width: 540px; margin: 0 auto 24px;
            background: var(--surface); padding: 32px 30px; border: 1px solid rgba(224,231,237,.9);
            border-radius: 25px; box-shadow: var(--shadow); overflow: hidden;
            animation: cardEnter .35s ease both;
        }
        .container::before {
            content: ''; position: absolute; top: 0; right: 0; left: 0; height: 5px;
            background: linear-gradient(90deg, var(--secondary), #75b99d 42%, var(--primary));
        }
        @keyframes cardEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        h2 { text-align: center; color: var(--primary); margin: 0 0 25px; font-weight: 900; font-size: 24px; letter-spacing: -.4px; }
        h2::after { content: ''; display: block; width: 42px; height: 3px; border-radius: 9px; margin: 10px auto 0; background: var(--secondary); }
        h3 { text-align: center; color: var(--primary); margin: 0 0 18px; font-weight: 800; font-size: 19px; }
        h4 { color: var(--primary); font-size: 15px; }
        label { display: block; margin-top: 16px; margin-bottom: 7px; font-weight: 700; font-size: 13px; color: #52647a; }
        input, select {
            width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid var(--border);
            background: var(--input-bg); color: var(--text-main); border-radius: 13px;
            font-family: inherit; font-size: 14px; transition: border-color .2s, box-shadow .2s, background .2s;
        }
        input::placeholder { color: #a1adba; }
        select { padding-left: 38px; cursor: pointer; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23718096' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: left 13px center; background-size: 16px; }
        input:focus, select:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 0 4px rgba(22,133,102,.11); background: #fff; }
        input[type="number"] { font-variant-numeric: tabular-nums; }
        button {
            width: 100%; min-height: 48px; background: var(--primary); color: white; border: 1px solid transparent;
            font-family: inherit; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 22px;
            padding: 12px 16px; border-radius: 13px; transition: background .2s, transform .2s, box-shadow .2s;
            box-shadow: 0 5px 12px rgba(20,43,74,.10);
        }
        button:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 8px 18px rgba(20,43,74,.15); }
        button:active { transform: translateY(0); }
        button:focus-visible { outline: 3px solid rgba(22,133,102,.35); outline-offset: 3px; }
        .btn-secondary { background: var(--secondary); box-shadow: 0 5px 12px rgba(22,133,102,.14); }
        .btn-secondary:hover { background: var(--secondary-hover); }
        .btn-cancel { background: #fff; color: var(--text-muted); border-color: var(--border); margin-top: 10px; box-shadow: none; }
        .btn-cancel:hover { background: #fff5f5; color: var(--danger); border-color: #efc5c7; box-shadow: none; }
        .btn-logout { background: #fff; color: var(--danger); border: 1px solid #f0d5d6; margin-top: 25px; box-shadow: none; }
        .btn-logout:hover { background: #fff5f5; color: #a92f39; border-color: #e8b6b9; box-shadow: none; }
        .btn-text { background: transparent; color: var(--secondary); padding: 5px 2px; margin-top: 8px; font-size: 13px; width: auto; min-height: auto; font-weight: 800; display: inline-block; box-shadow: none; }
        .btn-text:hover { background: transparent; color: var(--secondary-hover); transform: none; box-shadow: none; text-decoration: underline; }
        hr { border: 0; border-top: 1px solid var(--border) !important; }
        .flex-row { display: flex; gap: 9px; align-items: center; }
        .flex-row select { flex: 1; min-width: 0; }
        .btn-icon { flex: 0 0 48px; width: 48px; min-height: 48px; padding: 8px; margin-top: 0; background: var(--primary-soft); border: 1px solid #dce5ee; color: var(--primary); font-size: 18px; border-radius: 13px; box-shadow: none; }
        .btn-icon:hover { background: #dce8f2; transform: none; box-shadow: none; }
        .category-step { margin-bottom: 9px; transition: all .25s ease; }

        .category-picker { position: relative; margin-bottom: 8px; z-index: 20; }
        .category-picker-trigger { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; margin: 0; padding: 13px 15px; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border); border-radius: 13px; box-shadow: none; text-align: right; font-weight: 700; }
        .category-picker-trigger:hover { background: #fff; border-color: #b9c9d7; box-shadow: none; transform: none; }
        .category-picker-trigger[aria-expanded="true"] { border-color: var(--secondary); box-shadow: 0 0 0 4px rgba(22,133,102,.10); }
        .picker-chevron { color: var(--text-muted); font-size: 20px; line-height: 1; }
        .category-picker-panel { position: absolute; top: calc(100% + 7px); right: 0; left: 0; background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 18px 45px rgba(20,43,74,.18); overflow: hidden; z-index: 100; }
        .picker-topbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #f6f9fb; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 900; color: var(--primary); }
        .picker-topbar #categoryPickerHeading { flex: 1; }
        .picker-back, .picker-close { width: auto; min-height: 32px; margin: 0; padding: 5px 8px; border-radius: 8px; font-size: 12px; box-shadow: none; }
        .picker-back { background: var(--primary-soft); color: var(--primary); }
        .picker-back:hover, .picker-close:hover { transform: none; box-shadow: none; }
        .picker-close { background: transparent; color: var(--text-muted); font-size: 14px; }
        .picker-search { width: calc(100% - 20px); margin: 10px; min-height: 42px; padding: 9px 12px; }
        .picker-options { max-height: 270px; overflow-y: auto; padding: 0 8px 8px; }
        .picker-option { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; min-height: 43px; margin: 3px 0; padding: 10px 12px; background: #fff; color: var(--text-main); border: 1px solid transparent; border-radius: 10px; text-align: right; font-size: 13px; font-weight: 700; box-shadow: none; }
        .picker-option:hover { background: #f0f8f4; border-color: #d3eadf; color: #12664f; transform: none; box-shadow: none; }
        .picker-option .option-meta { color: var(--text-muted); font-size: 11px; font-weight: 500; }
        .picker-empty { padding: 18px 12px; text-align: center; color: var(--text-muted); font-size: 12px; }
        .category-tools-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        #categoryPickerHint { font-size: 11px; color: var(--text-muted); }
        .category-tools-row .btn-text { margin: 0; }
        @media (max-width: 600px) { .category-picker-panel { position: relative; top: auto; margin-top: 7px; } .picker-options { max-height: 240px; } .category-tools-row { align-items: flex-start; } }

        .recent-wrapper { margin-top: 15px; margin-bottom: 13px; padding: 13px; border: 1px solid #dcefe7; border-radius: 15px; background: #f7fcf9; }
        .recent-header { font-size: 12px; color: var(--secondary); font-weight: 800; margin-bottom: 10px; }
        .recent-container { display: flex; flex-wrap: wrap; gap: 7px; }
        .recent-chip { width: auto; min-height: 34px; background: var(--secondary-soft); color: #12664f; border: 1px solid #d3eadf; border-radius: 10px; padding: 6px 11px; font-size: 12px; font-weight: 700; cursor: pointer; margin: 0; box-shadow: none; }
        .recent-chip:hover { background: #d8eee3; transform: translateY(-1px); box-shadow: none; }
        #network-status { text-align: center; font-size: 12px; margin-bottom: 23px; padding: 10px 12px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); font-weight: 800; border: 1px solid #dce6f0; }
        .user-email-badge { text-align: center; font-size: 14px; font-weight: 800; color: var(--primary); margin-bottom: 14px; padding: 12px; background: #f7f9fb; border: 1px solid var(--border); border-radius: 13px; }
        .hidden { display: none !important; }
        .modal-overlay { position: fixed; inset: 0; width: 100%; height: 100%; padding: 18px; background: rgba(11,27,46,.56); backdrop-filter: blur(7px); display: flex; justify-content: center; align-items: center; z-index: 1000; overflow-y: auto; }
        .modal-content { background: var(--surface); padding: 28px 25px; border: 1px solid rgba(255,255,255,.7); border-radius: 22px; width: 100%; max-width: 430px; box-shadow: 0 25px 70px rgba(8,24,42,.25); margin: auto; max-height: 90vh; overflow-y: auto; }
        .cat-tools { display: grid; grid-template-columns: 1fr 145px; gap: 8px; margin-top: 12px; }
        .cat-tools input, .cat-tools select { min-height: 43px; font-size: 13px; }
        .cat-summary { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 10px; color: var(--text-muted); font-size: 12px; }
        .cat-list { max-height: 280px; overflow-y: auto; margin-top: 10px; border: 1px solid var(--border); border-radius: 14px; padding: 13px; background: #f9fbfc; }
        .cat-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 22px 8px; }
        .cat-status { display: none; padding: 10px 12px; border-radius: 10px; margin-top: 10px; font-size: 12px; font-weight: 700; }
        .cat-status.show { display: block; }
        .cat-status.error { color: #a92f39; background: #fff1f1; border: 1px solid #f0d5d6; }
        .cat-status.success { color: #12664f; background: #e8f5ef; border: 1px solid #d3eadf; }
        .tree-type { font-weight: 900; margin-top: 13px; color: var(--primary); font-size: 14px; border-bottom: 2px solid #e4ebf0; padding-bottom: 7px; }
        .tree-type:first-child { margin-top: 0; }
        .tree-main { margin-right: 14px; font-weight: 800; margin-top: 12px; color: var(--secondary); font-size: 13px; }
        .tree-sub { margin-right: 27px; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed #e0e7ed; font-size: 12px; color: #52647a; }
        .tree-sub:last-child { border-bottom: none; }
        .cat-delete { color: var(--danger); cursor: pointer; font-weight: 900; padding: 4px 8px; border-radius: 7px; }
        .cat-delete:hover { background: #fff0f0; }
        .tree-sub-label { min-width: 0; overflow-wrap: anywhere; }
        #transactionForm > label:first-child { margin-top: 0; }
        #transactionForm > button[type="submit"] { background: linear-gradient(135deg, var(--secondary), #117455); box-shadow: 0 8px 18px rgba(22,133,102,.19); }
        #transactionForm > button[type="submit"]:hover { background: linear-gradient(135deg, #117455, #0d6248); }
        #auth-section { max-width: 460px; margin-top: min(7vh, 64px); }
        #auth-title { margin-bottom: 27px; }
        #app-section { max-width: 620px; }
        #app-section form { margin-top: 3px; }
        #amount { font-weight: 800; font-size: 16px; }
        #modalAccountForm, #modalCategoryForm { margin-top: 5px; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f0f3f6; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #c7d2dc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #9eafbd; }

        @media (max-width: 600px) {
            .cat-tools { grid-template-columns: 1fr; }
            body { padding: 14px 10px; }
            .container { padding: 26px 18px; border-radius: 21px; margin-bottom: 14px; }
            #app-section { padding: 24px 17px; }
            h2 { font-size: 22px; margin-bottom: 22px; }
            input, select { min-height: 47px; padding: 11px 12px; font-size: 14px; }
            select { padding-left: 34px; background-position: left 10px center; }
            button { min-height: 47px; }
            .modal-overlay { padding: 10px; align-items: center; }
            .modal-content { padding: 24px 17px; border-radius: 19px; }
            .flex-row { gap: 7px; }
            .btn-icon { flex-basis: 46px; width: 46px; min-height: 46px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
        }

        /* تم تیره، مینیمال و یکدست */
        :root {
            --primary: #dbeafe; --primary-hover: #bfdbfe; --primary-soft: #1d2b40;
            --secondary: #34d399; --secondary-hover: #6ee7b7; --secondary-soft: #15352f;
            --bg-color: #0b0f14; --surface: #121820; --text-main: #e6edf5;
            --text-muted: #98a6b8; --border: #283341; --input-bg: #0e141b;
            --danger: #fb7185; --shadow: 0 22px 60px rgba(0,0,0,.28);
        }
        html { background: #0b0f14; color-scheme: dark; }
        body { background: radial-gradient(ellipse at 100% 0%, rgba(52,211,153,.075), transparent 30%), radial-gradient(ellipse at 0% 100%, rgba(96,165,250,.07), transparent 34%), #0b0f14; color: var(--text-main); }
        .container { background: #121820; border-color: #26313e; box-shadow: 0 22px 60px rgba(0,0,0,.28); }
        .container::before { height: 3px; background: linear-gradient(90deg, #34d399, #60a5fa); }
        h2, h3, h4 { color: #e6edf5; }
        label { color: #b0bdcc; }
        input, select, textarea { background-color: #0e141b; color: #e6edf5; border-color: #2a3543; }
        input::placeholder { color: #718096; }
        input:focus, select:focus, textarea:focus { background-color: #111923; border-color: #34d399; box-shadow: 0 0 0 3px rgba(52,211,153,.12); }
        button { background: #26364a; color: #eef5ff; box-shadow: none; }
        button:hover { background: #30445c; box-shadow: none; }
        .btn-secondary, #transactionForm > button[type="submit"] { background: linear-gradient(135deg, #168566, #116b55); color: #f0fdf8; }
        .btn-secondary:hover, #transactionForm > button[type="submit"]:hover { background: linear-gradient(135deg, #199875, #147b61); }
        .btn-cancel, .btn-logout { background: #171f29; color: #b8c5d4; border-color: #2b3745; }
        .btn-cancel:hover, .btn-logout:hover { background: #251a22; color: #fda4af; border-color: #67313d; }
        .btn-icon { background: #1b2938; border-color: #2c4054; color: #c5ddf8; }
        .btn-icon:hover { background: #24384c; }
        .category-picker-trigger { background: #0e141b; color: #e6edf5; border-color: #2a3543; }
        .category-picker-trigger:hover { background: #151e28; border-color: #3d5368; }
        .category-picker-panel { background: #121a23; border-color: #2a3543; box-shadow: 0 22px 55px rgba(0,0,0,.45); }
        .picker-topbar { background: #17212c; color: #e6edf5; border-color: #2a3543; }
        .picker-back { background: #1d2b40; color: #dbeafe; }
        .picker-close { background: transparent; color: #9aa9ba; }
        .picker-search { background: #0c1219; }
        .picker-option { background: transparent; color: #dce6f1; border-color: #26313e; }
        .picker-option:hover { background: #172a28; border-color: #285748; color: #6ee7b7; }
        .picker-option .option-meta { color: #8d9bad; }
        .picker-option.is-expanded { background: #172a28; border-color: #28624f; color: #6ee7b7; }
        .picker-type-tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 9px 10px 3px; }
        .picker-type-tab { flex: 1 1 calc(50% - 6px); width: auto; min-height: 35px; margin: 0; padding: 7px 8px; background: #17212c; color: #aebdcd; border: 1px solid #2a3543; border-radius: 9px; font-size: 12px; box-shadow: none; }
        .picker-type-tab:hover { transform: none; box-shadow: none; background: #1b2a36; }
        .picker-type-tab.active { background: #15352f; color: #6ee7b7; border-color: #28624f; }
        .picker-suboptions { margin: 0 10px 8px 0; padding: 5px 10px 7px; border-right: 2px solid #2c705b; background: rgba(20,45,40,.48); border-radius: 0 0 10px 10px; }
        .picker-suboptions .picker-option { min-height: 37px; margin: 3px 0; padding: 8px 10px; background: rgba(10,18,22,.45); font-size: 12px; }
        .picker-suboptions .picker-option:hover { background: #1b3930; }
        .recent-wrapper { background: #14231f; border-color: #25483d; }
        .recent-header { color: #6ee7b7; }
        .recent-chip { background: #1a352d; color: #a7f3d0; border-color: #2a5a49; }
        .recent-chip:hover { background: #214638; }
        #network-status { background: #182536; color: #c8ddf6; border-color: #2a3d53; }
        .user-email-badge { background: #171f29; color: #dbeafe; border-color: #2a3543; }
        .modal-overlay { background: rgba(2,6,12,.76); }
        .modal-content { background: #121820; border-color: #2a3543; box-shadow: 0 25px 70px rgba(0,0,0,.55); }
        .cat-list { background: #0e141b; border-color: #2a3543; }
        .tree-sub { color: #aab7c6; border-bottom-color: #2a3543; }
        .tree-main { color: #6ee7b7; }
        .cat-delete:hover { background: #2a1b22; }
        hr { border-color: #2a3543 !important; }
        ::-webkit-scrollbar-track { background: #111923; }
        ::-webkit-scrollbar-thumb { background: #344253; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5d70; }
        .category-picker-panel .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="auth-section" class="container">
    <h2 id="auth-title">ورود به سیستم</h2>
    <div id="username-div" class="hidden">
        <label>نام کاربری:</label>
        <input type="text" id="auth_username" placeholder="مثلاً Ali_Accountant">
    </div>
    <label>ایمیل:</label>
    <input type="email" id="auth_email" placeholder="name@example.com" required>
    <label>رمز عبور:</label>
    <input type="password" id="auth_password" placeholder="حداقل ۶ کاراکتر" required>
    
    <div id="login-buttons">
        <button onclick="handleLogin()">ورود به حساب</button>
        <div style="text-align: right;"><button type="button" class="btn-text" onclick="handleResetPassword()">فراموشی رمز عبور؟</button></div>
        <hr style="border-top: 1px solid #eee; margin: 20px 0;">
        <button type="button" class="btn-secondary" onclick="toggleAuthMode('signup')">ثبت‌نام حساب کاربری جدید</button>
    </div>

    <div id="signup-buttons" class="hidden">
        <button onclick="handleSignUp()">ثبت‌نام در سیستم</button>
        <hr style="border-top: 1px solid #eee; margin: 20px 0;">
        <button type="button" class="btn-cancel" onclick="toggleAuthMode('login')">بازگشت به صفحه ورود</button>
    </div>
</div>

<div id="app-section" class="container hidden">
    <h2>حسابداری شخصی</h2>
    <div id="user-info" class="user-email-badge"></div>
    <div id="network-status">در حال اتصال به سرور...</div>

    <form id="transactionForm">
        <label>نوع تراکنش:</label>
        <select id="type" required onchange="handleTransactionTypeChange()">
            <option value="پرداخت">پرداخت</option>
            <option value="دریافت">دریافت</option>
            <option value="انتقال موجودی">انتقال موجودی</option>
            <option value="مغایرت موجودی">مغایرت موجودی</option>
        </select>

        <div id="singleAccountDiv">
            <label>حساب بانکی:</label>
            <select id="account_id" onchange="checkAddAccountSelection(this)"></select>
        </div>

        <div id="transferDiv" class="hidden">
            <label>انتقال از حساب (مبدا):</label>
            <select id="from_account_id" onchange="checkAddAccountSelection(this)"></select>
            <label>انتقال به حساب (مقصد):</label>
            <select id="to_account_id" onchange="checkAddAccountSelection(this)"></select>
        </div>

        <div id="categoryDiv">
            <label>دسته‌بندی تراکنش:</label>

            <!-- بخش دسته‌بندی‌های اخیر -->
            <div id="recent_categories_wrapper" class="recent-wrapper hidden">
                <div class="recent-header">⚡ انتخاب سریع از تراکنش‌های اخیر:</div>
                <div id="recent_categories_container" class="recent-container"></div>
            </div>

            <!-- انتخاب‌گر یکپارچه: نوع، دسته اصلی و زیردسته در یک فیلد -->
            <div class="category-picker" id="categoryPicker">
                <button type="button" class="category-picker-trigger" id="categoryPickerTrigger" aria-expanded="false" aria-controls="categoryPickerPanel" onclick="toggleCategoryPicker()">
                    <span id="categoryPickerLabel">انتخاب دسته‌بندی...</span><span class="picker-chevron">⌄</span>
                </button>
                <div class="category-picker-panel hidden" id="categoryPickerPanel">
                    <div class="picker-topbar">
                        <button type="button" class="picker-back hidden" id="categoryPickerBack" onclick="categoryPickerBack()">→ بازگشت</button>
                        <span id="categoryPickerHeading">انتخاب دسته‌بندی</span>

    // بارگذاری هوشمند ۸ دسته اخیر از تراکنش‌ها
    async function loadRecentCategories() {
        if (!currentUser) return;
        try {
            const { data, error } = await supabaseClient.from('transactions')
                .select('category_type, category_main, category_sub')
                .not('category_type', 'is', null)
                .order('transaction_date', { ascending: false })
                .limit(30);

            if (error) throw error;
            
            const wrapper = document.getElementById('recent_categories_wrapper');
            const container = document.getElementById('recent_categories_container');
            
            if (!data || data.length === 0) {
                wrapper.classList.add('hidden');
                return;
            }

            const uniqueCats = [];
            const seen = new Set();
            for (let tx of data) {
                const key = `${tx.category_type}|${tx.category_main}|${tx.category_sub}`;
                if (!seen.has(key)) {
                    seen.add(key);
                    uniqueCats.push(tx);
                    if (uniqueCats.length >= 6) break; // حداکثر ۶ دکمه میان‌بر
                }
            }

            container.innerHTML = '';
            uniqueCats.forEach(c => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'recent-chip';
                const icon = c.category_type === 'هزینه' ? '🔴' : (c.category_type === 'درآمد' ? '🟢' : '🔵');
                btn.innerHTML = `${icon} ${c.category_sub}`;
                btn.onclick = () => selectRecentCategory(c.category_type, c.category_main, c.category_sub);
                container.appendChild(btn);
            });
            wrapper.classList.remove('hidden');

        } catch (e) {
            console.error("خطا در بارگذاری دسته‌های اخیر:", e);
        }
    }

            if (val && val !== 'ADD_NEW_ACCOUNT') el.value = val;
        };
        pop(document.getElementById('account_id')); pop(document.getElementById('from_account_id')); pop(document.getElementById('to_account_id'));
    }

    async function loadCategories() {
        if (!currentUser) return;
        const { data, error } = await supabaseClient.from('categories').select('*');
        if (error) {
            console.error('خطا در بارگذاری دسته‌بندی‌ها:', error);
            alert('بارگذاری دسته‌بندی‌ها ناموفق بود: ' + error.message);
            return;
        }
        if (!data || data.length === 0) {
            const { error: seedError } = await supabaseClient.from('categories').insert(defaultCategories);
            if (seedError) {
                console.error('خطا در ثبت دسته‌بندی‌های اولیه:', seedError);
                categoriesList = [];
                handleCatTypeChange();
                return;
            }
            return loadCategories();
        }

        categoriesList = data;
        handleCatTypeChange();
    }

    let categoryPickerLevel = 'main';
    let categoryPickerCurrentType = '';
    let categoryPickerCurrentMain = '';

    function handleCatTypeChange() {
        const type = document.getElementById('tx_cat_type').value;
        document.getElementById('tx_cat_main').innerHTML = '<option value="">انتخاب دسته اصلی</option>';
        document.getElementById('tx_cat_sub').innerHTML = '<option value="">انتخاب زیردسته</option>';
        if (!type) {
            categoryPickerLevel = 'type';
            categoryPickerCurrentType = '';
            categoryPickerCurrentMain = '';
            updateCategoryPickerLabel();
            if (document.getElementById('categoryPickerPanel') && !document.getElementById('categoryPickerPanel').classList.contains('hidden')) renderCategoryPickerOptions();
            return;
        }
        categoryPickerCurrentType = type;
        categoryPickerCurrentMain = '';
        categoryPickerLevel = 'main';
        updateCategoryPickerLabel();
        if (document.getElementById('categoryPickerPanel') && !document.getElementById('categoryPickerPanel').classList.contains('hidden')) renderCategoryPickerOptions();
    }

    function handleCatMainChange() {
        const type = document.getElementById('tx_cat_type').value;
        const main = document.getElementById('tx_cat_main').value;
        const subs = categoriesList.filter(c => c.type === type && c.category === main);
        document.getElementById('tx_cat_sub').innerHTML = '<option value="">انتخاب زیردسته</option>';
        subs.forEach(item => {
            const option = document.createElement('option'); option.value = item.subcategory; option.textContent = item.subcategory;
            document.getElementById('tx_cat_sub').appendChild(option);
        });
        categoryPickerCurrentType = type;
        categoryPickerCurrentMain = main;
        categoryPickerLevel = 'sub';
        if (document.getElementById('categoryPickerPanel') && !document.getElementById('categoryPickerPanel').classList.contains('hidden')) renderCategoryPickerOptions();
    }

    function toggleCategoryPicker() {
        const panel = document.getElementById('categoryPickerPanel');
        if (panel.classList.contains('hidden')) {
            const chosenType = document.getElementById('tx_cat_type').value;
            categoryPickerCurrentType = chosenType || '';
            categoryPickerCurrentMain = '';
            categoryPickerLevel = chosenType ? 'main' : 'type';
            document.getElementById('categoryPickerSearch').value = '';
            panel.classList.remove('hidden');
            document.getElementById('categoryPickerTrigger').setAttribute('aria-expanded', 'true');
            renderCategoryPickerOptions();
            document.getElementById('categoryPickerSearch').focus();
        } else closeCategoryPicker();
    }

    function closeCategoryPicker() {
        document.getElementById('categoryPickerPanel').classList.add('hidden');
        document.getElementById('categoryPickerTrigger').setAttribute('aria-expanded', 'false');
    }

    function categoryPickerBack() {
        if (categoryPickerLevel === 'sub') {
            categoryPickerLevel = 'main'; categoryPickerCurrentMain = '';
        } else if (categoryPickerLevel === 'main') {
            categoryPickerLevel = 'type'; categoryPickerCurrentType = '';
            document.getElementById('tx_cat_type').value = '';
            document.getElementById('tx_cat_main').value = '';
            document.getElementById('tx_cat_sub').value = '';
            updateCategoryPickerLabel();
        }
        document.getElementById('categoryPickerSearch').value = '';
        renderCategoryPickerOptions();
    }

    function renderCategoryPickerOptions() {
        const list = document.getElementById('categoryPickerOptions');
        const heading = document.getElementById('categoryPickerHeading');
        const back = document.getElementById('categoryPickerBack');
        const query = document.getElementById('categoryPickerSearch').value.trim().toLocaleLowerCase('fa');
        list.innerHTML = '';
        // در حالت انتخاب دسته اصلی، فهرست همه سر‌دسته‌ها ثابت می‌ماند؛ زیرمجموعه‌ها زیر مورد بازشده می‌آیند.
        back.classList.add('hidden');
        const addOption = (parent, label, meta, action, icon = '›', extraClass = '') => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `picker-option ${extraClass}`.trim();
            const title = document.createElement('span'); title.textContent = label;
            const right = document.createElement('span'); right.className = 'option-meta'; right.textContent = meta || icon;
            btn.append(title, right); btn.onclick = action; parent.appendChild(btn); return btn;
        };

        if (query) {
            heading.textContent = 'نتایج جست‌وجو';
            const matches = categoriesList.filter(c => `${c.type} ${c.category} ${c.subcategory}`.toLocaleLowerCase('fa').includes(query));
            const unique = new Set();
            matches.forEach(c => {
                const key = `${c.type}|${c.category}|${c.subcategory}`;
                if (unique.has(key)) return; unique.add(key);
                addOption(list, `${c.category} ← ${c.subcategory}`, c.type, () => {
                    setSelectedCategory(c.type, c.category, c.subcategory); closeCategoryPicker();
                }, '✓');
            });
            if (!unique.size) list.innerHTML = '<div class="picker-empty">موردی پیدا نشد.</div>';
            return;
        }

        if (categoryPickerLevel === 'type' || !categoryPickerCurrentType) {
            heading.textContent = 'انتخاب نوع دسته‌بندی';
            const types = [
                { value: 'هزینه', label: '🔴 هزینه' }, { value: 'درآمد', label: '🟢 درآمد' },
                { value: 'دارایی', label: '🔵 دارایی' }, { value: 'بدهی و طلب', label: '🟠 بدهی و طلب' }
            ];
            types.forEach(t => addOption(list, t.label, 'نمایش سر‌دسته‌ها', () => {
                categoryPickerCurrentType = t.value; categoryPickerCurrentMain = ''; categoryPickerLevel = 'main';
                document.getElementById('tx_cat_type').value = t.value;
                document.getElementById('tx_cat_main').innerHTML = '<option value="">انتخاب دسته اصلی</option>';
                document.getElementById('tx_cat_sub').innerHTML = '<option value="">انتخاب زیردسته</option>';
                updateCategoryPickerLabel(); renderCategoryPickerOptions();
            }));
            return;
        }

        heading.textContent = 'دسته‌ها و زیردسته‌ها';
        const typeTabs = document.createElement('div'); typeTabs.className = 'picker-type-tabs';
        [
            { value: 'هزینه', label: '🔴 هزینه' }, { value: 'درآمد', label: '🟢 درآمد' },
            { value: 'دارایی', label: '🔵 دارایی' }, { value: 'بدهی و طلب', label: '🟠 بدهی و طلب' }
        ].forEach(t => {
            const tab = document.createElement('button'); tab.type = 'button';
            tab.className = `picker-type-tab${t.value === categoryPickerCurrentType ? ' active' : ''}`;
            tab.textContent = t.label;
            tab.onclick = () => {
                categoryPickerCurrentType = t.value; categoryPickerCurrentMain = ''; categoryPickerLevel = 'main';
                document.getElementById('tx_cat_type').value = t.value;
                document.getElementById('tx_cat_main').innerHTML = '<option value="">انتخاب دسته اصلی</option>';
                document.getElementById('tx_cat_sub').innerHTML = '<option value="">انتخاب زیردسته</option>';
                updateCategoryPickerLabel(); renderCategoryPickerOptions();
            };
            typeTabs.appendChild(tab);
        });
        list.appendChild(typeTabs);
        const mains = [...new Set(categoriesList.filter(c => c.type === categoryPickerCurrentType).map(c => c.category))].sort((a,b) => a.localeCompare(b, 'fa'));
        mains.forEach(main => {
            const wrapper = document.createElement('div');
            wrapper.className = 'picker-main-group';
            const expanded = categoryPickerCurrentMain === main;
            addOption(wrapper, `${expanded ? '▾' : '📁'} ${main}`, expanded ? 'بستن زیردسته‌ها' : 'نمایش زیردسته‌ها', () => {
                categoryPickerCurrentMain = expanded ? '' : main;
                categoryPickerLevel = 'main';
                document.getElementById('tx_cat_main').value = categoryPickerCurrentMain;
                document.getElementById('tx_cat_sub').value = '';
                renderCategoryPickerOptions();
            }, expanded ? '−' : '+', expanded ? 'is-expanded' : '');
            if (expanded) {
                const subWrap = document.createElement('div'); subWrap.className = 'picker-suboptions';
                const subs = [...new Set(categoriesList.filter(c => c.type === categoryPickerCurrentType && c.category === main).map(c => c.subcategory))].sort((a,b) => a.localeCompare(b, 'fa'));
                subs.forEach(sub => addOption(subWrap, `↳ ${sub}`, 'انتخاب', () => {
                    setSelectedCategory(categoryPickerCurrentType, main, sub); closeCategoryPicker();
                }, '✓'));
                if (!subs.length) subWrap.innerHTML = '<div class="picker-empty">برای این دسته زیردسته‌ای ثبت نشده است.</div>';
                wrapper.appendChild(subWrap);
            }
            list.appendChild(wrapper);
        });
        if (!mains.length) list.innerHTML = '<div class="picker-empty">برای این نوع دسته‌ای ثبت نشده است.</div>';
    }

    function setSelectedCategory(type, main, sub) {
        const typeSelect = document.getElementById('tx_cat_type');
        const mainSelect = document.getElementById('tx_cat_main');
        const subSelect = document.getElementById('tx_cat_sub');
        typeSelect.value = type;
        mainSelect.innerHTML = '<option value="">انتخاب دسته اصلی</option>';
        [...new Set(categoriesList.filter(c => c.type === type).map(c => c.category))].forEach(name => {
            const option = document.createElement('option'); option.value = name; option.textContent = name; mainSelect.appendChild(option);
        });
        mainSelect.value = main;
        subSelect.innerHTML = '<option value="">انتخاب زیردسته</option>';
        categoriesList.filter(c => c.type === type && c.category === main).forEach(c => {
            const option = document.createElement('option'); option.value = c.subcategory; option.textContent = c.subcategory; subSelect.appendChild(option);
        });
        subSelect.value = sub;
        categoryPickerCurrentType = type; categoryPickerCurrentMain = main; categoryPickerLevel = 'main';
        updateCategoryPickerLabel();
    }

    function updateCategoryPickerLabel() {
        const type = document.getElementById('tx_cat_type').value;
        const main = document.getElementById('tx_cat_main').value;
        const sub = document.getElementById('tx_cat_sub').value;
        const label = document.getElementById('categoryPickerLabel');
        if (type && main && sub) label.textContent = `${type} ← ${main} ← ${sub}`;
        else if (type) label.textContent = `${type} · انتخاب دسته اصلی و زیردسته`;
        else label.textContent = 'انتخاب دسته‌بندی...';
    }

    function openCategoryModal() {
        document.getElementById('manageCategoryModal').classList.remove('hidden');
        document.getElementById('category_status').className = 'cat-status';
        document.getElementById('category_search').value = '';
        document.getElementById('category_filter_type').value = 'همه';
        renderCategoryList();
    }

    function showCategoryStatus(message, kind = 'success') {
        const el = document.getElementById('category_status');
        el.textContent = message;
        el.className = `cat-status show ${kind}`;
    }

    function normalizeCategoryText(value) {
        return String(value ?? '').trim().replace(/\s+/g, ' ');
    }

    function renderCategoryList() {
        const container = document.getElementById('category_list_container');
        const search = normalizeCategoryText(document.getElementById('category_search')?.value).toLocaleLowerCase('fa');
        const typeFilter = document.getElementById('category_filter_type')?.value || 'همه';
        container.innerHTML = '';

        const filtered = categoriesList.filter(c => {
            const typeMatches = typeFilter === 'همه' || c.type === typeFilter;
            const searchMatches = !search || `${c.type} ${c.category} ${c.subcategory}`.toLocaleLowerCase('fa').includes(search);
            return typeMatches && searchMatches;
        });
        document.getElementById('category_count').textContent = `${filtered.length.toLocaleString('fa-IR')} زیردسته`;

        if (!filtered.length) {
            const empty = document.createElement('div');
            empty.className = 'cat-empty';
            empty.textContent = categoriesList.length ? 'دسته‌بندی مطابق جست‌وجو پیدا نشد.' : 'هنوز دسته‌بندی‌ای ثبت نشده است.';
            container.appendChild(empty);
            return;
        }

        const types = ['هزینه', 'درآمد', 'دارایی', 'بدهی و طلب'];
        const typeIcons = {'هزینه': '🔴', 'درآمد': '🟢', 'دارایی': '🔵', 'بدهی و طلب': '🟠'};
        types.forEach(type => {
            const typeCats = filtered.filter(c => c.type === type);
            if (!typeCats.length) return;
            const typeDiv = document.createElement('div');
            typeDiv.className = 'tree-type';
            typeDiv.textContent = `${typeIcons[type] || '📌'} ${type}`;
            container.appendChild(typeDiv);

            const mains = [...new Set(typeCats.map(c => c.category))].sort((a,b) => a.localeCompare(b, 'fa'));
            mains.forEach(main => {
                const mainDiv = document.createElement('div');
                mainDiv.className = 'tree-main';
                mainDiv.textContent = `📁 ${main}`;
                container.appendChild(mainDiv);

                typeCats.filter(c => c.category === main)
                    .sort((a,b) => String(a.subcategory).localeCompare(String(b.subcategory), 'fa'))
                    .forEach(sub => {
                        const subDiv = document.createElement('div');
                        subDiv.className = 'tree-sub';
                        const label = document.createElement('span');
                        label.className = 'tree-sub-label';
                        label.textContent = `└─ 📄 ${sub.subcategory}`;
                        const del = document.createElement('button');
                        del.type = 'button';
                        del.className = 'cat-delete';
                        del.textContent = '×';
                        del.title = 'حذف زیردسته';
                        del.setAttribute('aria-label', `حذف ${sub.subcategory}`);
                        del.onclick = () => deleteCategory(sub.id);
                        subDiv.append(label, del);
                        container.appendChild(subDiv);
                    });
            });
        });
    }

    async function deleteCategory(id) {
        const category = categoriesList.find(c => String(c.id) === String(id));
        if (!category) return;
        const used = confirm(`زیردسته «${category.subcategory}» از دسته «${category.category}» حذف شود؟\n\nتوجه: این کار ممکن است روی تراکنش‌های قبلی اثر نگذارد، اما این زیردسته دیگر برای ثبت تراکنش جدید نمایش داده نمی‌شود.`);
        if (!used) return;
        const { error } = await supabaseClient.from('categories').delete().eq('id', id);
        if (error) {
            showCategoryStatus('حذف انجام نشد: ' + error.message, 'error');
            return;
        }
        await loadCategories();
        renderCategoryList();
        showCategoryStatus('زیردسته با موفقیت حذف شد.');
    }

    document.getElementById('modalCategoryForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const type = document.getElementById('cat_type').value;
        const category = normalizeCategoryText(document.getElementById('cat_category').value);
        const subcategory = normalizeCategoryText(document.getElementById('cat_subcategory').value);
        if (!type || !category || !subcategory) {
            showCategoryStatus('لطفاً نوع، دسته اصلی و زیردسته را کامل وارد کنید.', 'error');
            return;
        }

        const duplicate = categoriesList.some(c =>
            String(c.type).trim() === type &&
            normalizeCategoryText(c.category).toLocaleLowerCase('fa') === category.toLocaleLowerCase('fa') &&
            normalizeCategoryText(c.subcategory).toLocaleLowerCase('fa') === subcategory.toLocaleLowerCase('fa')
        );
        if (duplicate) {
            showCategoryStatus('این زیردسته قبلاً برای همین نوع و دسته اصلی ثبت شده است.', 'error');
            return;
        }

        const { error } = await supabaseClient.from('categories').insert([{ type, category, subcategory }]);
        if (error) {
            showCategoryStatus('ثبت دسته‌بندی انجام نشد: ' + error.message, 'error');
            return;
        }
        document.getElementById('cat_category').value = category;
        document.getElementById('cat_subcategory').value = '';
        await loadCategories();
        renderCategoryList();
        showCategoryStatus(`زیردسته «${subcategory}» با موفقیت اضافه شد.`);
    });

    function checkAddAccountSelection(el) {
        if (el.value === 'ADD_NEW_ACCOUNT') { activeSelectElement = el; document.getElementById('addAccountModal').classList.remove('hidden'); el.value = ''; }
    }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); activeSelectElement = null; }

    document.getElementById('modalAccountForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('modal_acc_name').value;
        const branch = document.getElementById('modal_acc_branch').value;
        const balance = parseFloat(document.getElementById('modal_acc_balance').value);
        const { data } = await supabaseClient.from('accounts').insert([{ name, branch, balance }]).select();
        alert('✅ حساب اضافه شد!');
        closeModal('addAccountModal');
        await loadAccounts();
        if (activeSelectElement) activeSelectElement.value = data[0].id;
    });

    document.getElementById('transactionForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const type = document.getElementById('type').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const date = document.getElementById('transaction_date').value;
        const desc = document.getElementById('description').value;

        let data = { type, amount, transaction_date: date, description: desc };
        
        if (type === 'انتقال موجودی') {
            const fromId = document.getElementById('from_account_id').value;
            const toId = document.getElementById('to_account_id').value;
            if (!fromId || !toId || fromId === toId) return alert('مبدا و مقصد نامعتبر است.');
            data.from_account_id = fromId; data.to_account_id = toId;
        } else {
            const accId = document.getElementById('account_id').value;
            const catType = document.getElementById('tx_cat_type').value;
            const catMain = document.getElementById('tx_cat_main').value;
            const catSub = document.getElementById('tx_cat_sub').value;
            
            if (!accId || !catType || !catMain || !catSub) return alert('لطفاً حساب بانکی و تمام سطوح دسته‌بندی را تا انتها انتخاب کنید.');
            
            data.account_id = accId;
            data.category_type = catType;
            data.category_main = catMain;
            data.category_sub = catSub;
        }

        const { error } = await supabaseClient.from('transactions').insert([data]);
        if(error) return alert('❌ خطا: ' + error.message);

        if (type === 'پرداخت' || type === 'دریافت') {
            const acc = accountsList.find(a => a.id === data.account_id);
            const newBal = type === 'پرداخت' ? parseFloat(acc.balance) - amount : parseFloat(acc.balance) + amount;
            await supabaseClient.from('accounts').update({ balance: newBal }).eq('id', data.account_id);
        } else if (type === 'انتقال موجودی') {
            const fAcc = accountsList.find(a => a.id === data.from_account_id);
            const tAcc = accountsList.find(a => a.id === data.to_account_id);
            await supabaseClient.from('accounts').update({ balance: parseFloat(fAcc.balance) - amount }).eq('id', data.from_account_id);
            await supabaseClient.from('accounts').update({ balance: parseFloat(tAcc.balance) + amount }).eq('id', data.to_account_id);
        }

        alert('✅ ثبت موفق!');
        document.getElementById('transactionForm').reset();
        setLocalDateTime(); 
        handleTransactionTypeChange(); 
        await loadAccounts();
        await loadRecentCategories(); // بروزرسانی میان‌برها پس از ثبت تراکنش جدید
    });
</script>
