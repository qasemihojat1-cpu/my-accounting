<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسابداری شخصی من</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 480px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2, h3 { text-align: center; color: #1a73e8; margin-top: 0; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
        input, select, button { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        button { background: #1a73e8; color: white; border: none; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; transition: background 0.3s; }
        button:hover { background: #1557b0; }
        .btn-secondary { background: #34a853; }
        .btn-secondary:hover { background: #2e8b45; }
        .btn-cancel { background: #dc3545; margin-top: 8px; }
        .btn-cancel:hover { background: #c82333; }
        #network-status { text-align: center; font-size: 13px; margin-bottom: 15px; padding: 6px; border-radius: 6px; background: #e8f0fe; color: #1a73e8; }
        .hidden { display: none; }
        
        /* استایل مودال (پنجره پاپ‌آپ) افزودن حساب */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="container">
    <h2>حسابداری شخصی</h2>
    <div id="network-status">در حال اتصال به سرور...</div>

    <!-- فرم ثبت تراکنش -->
    <form id="transactionForm">
        <h3>ثبت تراکنش جدید</h3>
        
        <label>نوع تراکنش:</label>
        <select id="type" required onchange="handleTransactionTypeChange()">
            <option value="پرداخت">پرداخت</option>
            <option value="دریافت">دریافت</option>
            <option value="انتقال موجودی">انتقال موجودی</option>
            <option value="مغایرت موجودی">مغایرت موجودی</option>
        </select>

        <!-- فیلد حساب بانکی (برای پرداخت، دریافت، مغایرت) -->
        <div id="singleAccountDiv">
            <label>حساب بانکی:</label>
            <select id="account_id" onchange="checkAddAccountSelection(this)">
                <option value="">انتخاب حساب بانکی...</option>
            </select>
        </div>

        <!-- فیلدهای انتقال موجودی (مبدا و مقصد) -->
        <div id="transferDiv" class="hidden">
            <label>انتقال از حساب (مبدا):</label>
            <select id="from_account_id" onchange="checkAddAccountSelection(this)">
                <option value="">انتخاب حساب مبدا...</option>
            </select>

            <label>انتقال به حساب (مقصد):</label>
            <select id="to_account_id" onchange="checkAddAccountSelection(this)">
                <option value="">انتخاب حساب مقصد...</option>
            </select>
        </div>

        <!-- فیلد دسته‌بندی -->
        <div id="categoryDiv">
            <label>دسته‌بندی:</label>
            <select id="category_select">
                <option value="general">عمومی / متفرقه</option>
            </select>
        </div>

        <label>مبلغ (تومان):</label>
        <input type="number" id="amount" placeholder="مثلاً 50000" required>

        <label>تاریخ و ساعت:</label>
        <input type="datetime-local" id="transaction_date" required>

        <label>توضیحات:</label>
        <input type="text" id="description" placeholder="توضیحات تراکنش...">

        <button type="submit">ثبت تراکنش</button>
    </form>
</div>

<!-- پنجره مودال (پاپ‌آپ) افزودن حساب بانکی جدید -->
<div id="addAccountModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3>افزودن حساب بانکی جدید</h3>
        <form id="modalAccountForm">
            <label>نام حساب:</label>
            <input type="text" id="modal_acc_name" placeholder="مثلاً بلو بانک، ملی..." required>

            <label>شعبه:</label>
            <input type="text" id="modal_acc_branch" placeholder="مثلاً شعبه مرکزی...">

            <label>مانده اولیه (تومان):</label>
            <input type="number" id="modal_acc_balance" placeholder="0" value="0" required>

            <button type="submit" class="btn-secondary">ثبت و انتخاب حساب</button>
            <button type="button" class="btn-cancel" onclick="closeModal()">انصراف</button>
        </form>
    </div>
</div>

<!-- کتابخانه اتصال به Supabase نسخه پایدار ۲ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = 'https://myqtpfdohayrhqmafqrj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6iFdGoWIvKrGKjfF_T-zXQ_-717yY63';
    
    let supabaseClient;
    try {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
        console.error('خطا در راه‌اندازی Supabase:', e);
    }

    // نگهداری عنصر انتخابی که کاربر خواسته در آن حساب جدید بسازد
    let activeSelectElement = null;

    function setLocalDateTime() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('transaction_date').value = now.toISOString().slice(0, 16);
    }
    setLocalDateTime();

    function updateNetworkStatus() {
        const statusEl = document.getElementById('network-status');
        if (navigator.onLine) {
            statusEl.innerText = '🟢 آنلاین - متصل به سرور ابری';
            statusEl.style.background = '#e6f4ea';
            statusEl.style.color = '#137333';
        } else {
            statusEl.innerText = '🔴 آفلاین - ذخیره روی حافظه موقت گوشی';
            statusEl.style.background = '#fef7e0';
            statusEl.style.color = '#b06000';
        }
    }

    window.addEventListener('load', async () => {
        updateNetworkStatus();
        await loadAccounts();
    });

    function handleTransactionTypeChange() {
        const type = document.getElementById('type').value;
        const singleDiv = document.getElementById('singleAccountDiv');
        const transferDiv = document.getElementById('transferDiv');
        const categoryDiv = document.getElementById('categoryDiv');

        if (type === 'انتقال موجودی') {
            singleDiv.classList.add('hidden');
            transferDiv.classList.remove('hidden');
            categoryDiv.classList.add('hidden');
        } else {
            singleDiv.classList.remove('hidden');
            transferDiv.classList.add('hidden');
            categoryDiv.classList.remove('hidden');
        }
    }

    let accountsList = [];

    // بارگذاری حساب‌های بانکی و افزودن گزینه «+ افزودن حساب جدید» به منوهای کشویی
    async function loadAccounts(selectToFocusId = null) {
        try {
            const { data, error } = await supabaseClient.from('accounts').select('*');
            if (error) throw error;
            
            accountsList = data || [];

            const accSelect = document.getElementById('account_id');
            const fromSelect = document.getElementById('from_account_id');
            const toSelect = document.getElementById('to_account_id');

            const populateSelect = (selectEl) => {
                const currentVal = selectEl.value;
                selectEl.innerHTML = '<option value="">انتخاب حساب بانکی...</option>';
                
                accountsList.forEach(acc => {
                    const opt = document.createElement('option');
                    opt.value = acc.id;
                    opt.innerText = `${acc.name} (${acc.branch || 'بدون شعبه'}) - موجودی: ${acc.balance} تومان`;
                    selectEl.appendChild(opt);
                });

                // اضافه کردن گزینه افزودن حساب جدید در انتهای لیست
                const addOpt = document.createElement('option');
                addOpt.value = 'ADD_NEW_ACCOUNT';
                addOpt.innerText = '➕ افزودن حساب بانکی جدید...';
                selectEl.appendChild(addOpt);

                if (currentVal && currentVal !== 'ADD_NEW_ACCOUNT') {
                    selectEl.value = currentVal;
                }
            };

            populateSelect(accSelect);
            populateSelect(fromSelect);
            populateSelect(toSelect);

            if (selectToFocusId) {
                document.getElementById(selectToFocusId).value = selectToFocusId;
            }
        } catch (err) {
            console.error('خطا در بارگذاری حساب‌ها:', err.message);
        }
    }

    // بررسی اینکه آیا کاربر گزینه «افزودن حساب جدید» را انتخاب کرده است یا خیر
    function checkAddAccountSelection(selectElement) {
        if (selectElement.value === 'ADD_NEW_ACCOUNT') {
            activeSelectElement = selectElement;
            document.getElementById('addAccountModal').classList.remove('hidden');
            selectElement.value = ''; // ریست کردن موقت انتخاب
        }
    }

    function closeModal() {
        document.getElementById('addAccountModal').classList.add('hidden');
        document.getElementById('modalAccountForm').reset();
        activeSelectElement = null;
    }

    // ثبت حساب بانکی جدید از طریق پنجره پاپ‌آپ
    document.getElementById('modalAccountForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const name = document.getElementById('modal_acc_name').value;
        const branch = document.getElementById('modal_acc_branch').value;
        const balance = parseFloat(document.getElementById('modal_acc_balance').value);

        try {
            const { data, error } = await supabaseClient.from('accounts').insert([{ name, branch, balance }]).select();
            if (error) throw error;

            const newAccount = data[0];
            alert('✅ حساب بانکی جدید با موفقیت اضافه شد!');
            
            closeModal();
            await loadAccounts();

            // انتخاب خودکار حساب جدید ساخته شده در همان فیلدی که کاربر روی آن کلیک کرده بود
            if (activeSelectElement) {
                activeSelectElement.value = newAccount.id;
            }
        } catch (err) {
            alert('❌ خطا در ثبت حساب: ' + err.message);
        }
    });

    // ثبت تراکنش جدید
    document.getElementById('transactionForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const type = document.getElementById('type').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const transaction_date = document.getElementById('transaction_date').value;
        const description = document.getElementById('description').value;

        let transactionData = {
            type,
            amount,
            transaction_date,
            description
        };

        let targetAccountId = null;
        let fromAccId = null;
        let toAccId = null;

        if (type === 'انتقال موجودی') {
            fromAccId = document.getElementById('from_account_id').value;
            toAccId = document.getElementById('to_account_id').value;
            if (!fromAccId || !toAccId) {
                alert('لطفاً حساب مبدا و مقصد را انتخاب کنید.');
                return;
            }
            if (fromAccId === toAccId) {
                alert('حساب مبدا و مقصد نمی‌تواند یکی باشد.');
                return;
            }
            transactionData.from_account_id = fromAccId;
            transactionData.to_account_id = toAccId;
        } else {
            targetAccountId = document.getElementById('account_id').value;
            if (!targetAccountId) {
                alert('لطفاً حساب بانکی را انتخاب کنید.');
                return;
            }
            transactionData.account_id = targetAccountId;
        }

        try {
            // ۱. ثبت تراکنش در جدول
            const { error: txError } = await supabaseClient.from('transactions').insert([transactionData]);
            if (txError) throw txError;

            // ۲. به‌روزرسانی موجودی حساب‌ها
            if (type === 'پرداخت') {
                const acc = accountsList.find(a => a.id === targetAccountId);
                const newBalance = parseFloat(acc.balance) - amount;
                await supabaseClient.from('accounts').update({ balance: newBalance }).eq('id', targetAccountId);
            } else if (type === 'دریافت') {
                const acc = accountsList.find(a => a.id === targetAccountId);
                const newBalance = parseFloat(acc.balance) + amount;
                await supabaseClient.from('accounts').update({ balance: newBalance }).eq('id', targetAccountId);
            } else if (type === 'انتقال موجودی') {
                const fromAcc = accountsList.find(a => a.id === fromAccId);
                const toAcc = accountsList.find(a => a.id === toAccId);

                const newFromBalance = parseFloat(fromAcc.balance) - amount;
                const newToBalance = parseFloat(toAcc.balance) + amount;

                await supabaseClient.from('accounts').update({ balance: newFromBalance }).eq('id', fromAccId);
                await supabaseClient.from('accounts').update({ balance: newToBalance }).eq('id', toAccId);
            }

            alert('✅ تراکنش ثبت شد و موجودی حساب‌ها به‌روزرسانی گردید!');
            document.getElementById('transactionForm').reset();
            setLocalDateTime();
            handleTransactionTypeChange();
            await loadAccounts();
        } catch (err) {
            alert('❌ خطا در ثبت تراکنش: ' + err.message);
        }
    });
</script>

</body>
</html>
