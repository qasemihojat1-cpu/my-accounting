<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسابداری شخصی من</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #10b981;
            --secondary-hover: #059669;
            --bg-color: #f3f4f6;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --input-bg: #f9fafb;
            --danger: #ef4444;
        }

        body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: var(--bg-color); margin: 0; padding: 20px 15px; color: var(--text-main); line-height: 1.6; }
        .container { max-width: 450px; margin: auto; background: var(--surface); padding: 30px 25px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { text-align: center; color: var(--primary); margin-top: 0; font-weight: 800; font-size: 22px; margin-bottom: 25px; }
        h3 { text-align: center; color: var(--text-main); margin-top: 0; font-weight: 700; font-size: 18px; margin-bottom: 15px; }
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }

        input, select { 
            width: 100%; padding: 14px 16px; border: 1px solid var(--border); background-color: var(--input-bg);
            border-radius: 12px; box-sizing: border-box; font-family: inherit; font-size: 14px; transition: all 0.3s ease; appearance: none;
        }
        select { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: left 12px center; background-size: 16px; }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); background-color: #fff; }

        button { width: 100%; background: var(--primary); color: white; border: none; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 25px; padding: 15px; border-radius: 14px; transition: all 0.2s ease; }
        button:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-secondary { background: var(--secondary); }
        .btn-secondary:hover { background: var(--secondary-hover); }
        .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border); margin-top: 10px; }
        .btn-cancel:hover { background: #fee2e2; color: var(--danger); border-color: var(--danger); }
        .btn-logout { background: var(--danger); margin-top: 30px; }
        .btn-logout:hover { background: #dc2626; }
        .btn-text { background: transparent; color: var(--primary); padding: 5px; margin-top: 5px; font-size: 13px; width: auto; font-weight: 600; display: inline-block; }
        
        .flex-row { display: flex; gap: 8px; align-items: center; }
        .flex-row select { flex: 1; }
        .btn-icon { width: auto; padding: 12px 15px; margin-top: 0; background: var(--input-bg); border: 1px solid var(--border); color: var(--text-main); font-size: 18px; border-radius: 12px; }
        .btn-icon:hover { background: #e5e7eb; transform: none; }

        .category-step { margin-bottom: 8px; transition: all 0.3s ease; }

        /* استایل نشان‌های (Chips) دسته‌بندی‌های اخیر */
        .recent-wrapper { margin-top: 15px; margin-bottom: 10px; }
        .recent-header { font-size: 11px; color: var(--text-muted); font-weight: bold; margin-bottom: 8px; }
        .recent-container { display: flex; flex-wrap: wrap; gap: 6px; }
        .recent-chip { 
            background: #e0e7ff; color: #4338ca; border: none; border-radius: 20px; 
            padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; 
            margin: 0; width: auto; transition: all 0.2s; box-shadow: none;
        }
        .recent-chip:hover { background: #c7d2fe; transform: scale(1.05); }

        #network-status { text-align: center; font-size: 12px; margin-bottom: 25px; padding: 8px; border-radius: 8px; background: #eff6ff; color: var(--primary); font-weight: 600; }
        .user-email-badge { text-align: center; font-size: 14px; font-weight: bold; color: var(--text-main); margin-bottom: 15px; padding: 10px; background: var(--input-bg); border-radius: 10px; }
        .hidden { display: none !important; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(17, 24, 39, 0.5); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 1000; overflow-y: auto; }
        .modal-content { background: var(--surface); padding: 30px 25px; border-radius: 24px; width: 85%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); margin: auto; max-height: 90vh; overflow-y: auto;}
        
        .cat-list { max-height: 250px; overflow-y: auto; margin-top: 15px; border: 1px solid var(--border); border-radius: 12px; padding: 15px; background: #fafafa; }
        .tree-type { font-weight: 800; margin-top: 10px; color: var(--text-main); font-size: 15px; border-bottom: 2px solid var(--border); padding-bottom: 4px; }
        .tree-type:first-child { margin-top: 0; }
        .tree-main { margin-right: 15px; font-weight: 700; margin-top: 10px; color: var(--primary); font-size: 14px; }
        .tree-sub { margin-right: 35px; display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #e5e7eb; font-size: 13px; color: #4b5563; }
        .tree-sub:last-child { border-bottom: none; }
        .cat-delete { color: var(--danger); cursor: pointer; font-weight: bold; padding: 5px; border-radius: 6px; }
        .cat-delete:hover { background: #fee2e2; }
    </style>
</head>
<body>

<div id="auth-section" class="container">
    <h2 id="auth-title">ورود به سیستم</h2>
    <div id="username-div" class="hidden">
        <label>نام کاربری:</label>
        <input type="text" id="auth_username" placeholder="مثلاً Ali_Accountant">
    </div>
    <label>ایمیل:</label>
    <input type="email" id="auth_email" placeholder="name@example.com" required>
    <label>رمز عبور:</label>
    <input type="password" id="auth_password" placeholder="حداقل ۶ کاراکتر" required>
    
    <div id="login-buttons">
        <button onclick="handleLogin()">ورود به حساب</button>
        <div style="text-align: right;"><button type="button" class="btn-text" onclick="handleResetPassword()">فراموشی رمز عبور؟</button></div>
        <hr style="border-top: 1px solid #eee; margin: 20px 0;">
        <button type="button" class="btn-secondary" onclick="toggleAuthMode('signup')">ثبت‌نام حساب کاربری جدید</button>
    </div>

    <div id="signup-buttons" class="hidden">
        <button onclick="handleSignUp()">ثبت‌نام در سیستم</button>
        <hr style="border-top: 1px solid #eee; margin: 20px 0;">
        <button type="button" class="btn-cancel" onclick="toggleAuthMode('login')">بازگشت به صفحه ورود</button>
    </div>
</div>

<div id="app-section" class="container hidden">
    <h2>حسابداری شخصی</h2>
    <div id="user-info" class="user-email-badge"></div>
    <div id="network-status">در حال اتصال به سرور...</div>

    <form id="transactionForm">
        <label>نوع تراکنش:</label>
        <select id="type" required onchange="handleTransactionTypeChange()">
            <option value="پرداخت">پرداخت</option>
            <option value="دریافت">دریافت</option>
            <option value="انتقال موجودی">انتقال موجودی</option>
            <option value="مغایرت موجودی">مغایرت موجودی</option>
        </select>

        <div id="singleAccountDiv">
            <label>حساب بانکی:</label>
            <select id="account_id" onchange="checkAddAccountSelection(this)"></select>
        </div>

        <div id="transferDiv" class="hidden">
            <label>انتقال از حساب (مبدا):</label>
            <select id="from_account_id" onchange="checkAddAccountSelection(this)"></select>
            <label>انتقال به حساب (مقصد):</label>
            <select id="to_account_id" onchange="checkAddAccountSelection(this)"></select>
        </div>

        <div id="categoryDiv">
            <label>دسته‌بندی تراکنش:</label>

            <!-- بخش دسته‌بندی‌های اخیر -->
            <div id="recent_categories_wrapper" class="recent-wrapper hidden">
                <div class="recent-header">⚡ انتخاب سریع از تراکنش‌های اخیر:</div>
                <div id="recent_categories_container" class="recent-container"></div>
            </div>

            <div class="category-step">
                <select id="tx_cat_type" onchange="handleCatTypeChange()" required>
                    <option value="">۱. انتخاب نوع دسته‌بندی...</option>
                    <option value="هزینه">🔴 هزینه</option>
                    <option value="درآمد">🟢 درآمد</option>
                    <option value="دارایی">🔵 دارایی</option>
                </select>
            </div>
            <div class="category-step hidden" id="cat_main_container">
                <select id="tx_cat_main" onchange="handleCatMainChange()" required>
                    <option value="">۲. انتخاب دسته اصلی...</option>
                </select>
            </div>
            <div class="category-step flex-row hidden" id="cat_sub_container">
                <select id="tx_cat_sub" required>
                    <option value="">۳. انتخاب زیردسته نهایی...</option>
                </select>
                <button type="button" class="btn-icon" onclick="openCategoryModal()" title="تنظیمات دسته‌بندی‌ها">⚙️</button>
            </div>
        </div>

        <label>مبلغ (تومان):</label>
        <input type="number" id="amount" placeholder="مثلاً ۵۰,۰۰۰" required>
        <label>تاریخ و ساعت:</label>
        <input type="datetime-local" id="transaction_date" required>
        <label>توضیحات:</label>
        <input type="text" id="description" placeholder="توضیحات تراکنش...">
        
        <button type="submit">ثبت تراکنش</button>
    </form>
    
    <button class="btn-logout" onclick="handleLogout()">خروج از حساب کاربری</button>
</div>

<!-- مودال افزودن حساب بانکی -->
<div id="addAccountModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3>افزودن حساب جدید</h3>
        <form id="modalAccountForm">
            <label>نام حساب:</label><input type="text" id="modal_acc_name" required>
            <label>شعبه:</label><input type="text" id="modal_acc_branch">
            <label>مانده اولیه (تومان):</label><input type="number" id="modal_acc_balance" value="0" required>
            <button type="submit" class="btn-secondary">ثبت و انتخاب حساب</button>
            <button type="button" class="btn-cancel" onclick="closeModal('addAccountModal')">انصراف</button>
        </form>
    </div>
</div>

<!-- مودال مدیریت دسته‌بندی‌ها -->
<div id="manageCategoryModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3>ساختار درختی دسته‌بندی‌ها</h3>
        <div class="cat-list" id="category_list_container"></div>
        <hr style="border-top: 1px solid #eee; margin: 15px 0;">
        <h4>افزودن شاخه جدید</h4>
        <form id="modalCategoryForm">
            <label>نوع:</label>
            <select id="cat_type" required>
                <option value="هزینه">هزینه</option>
                <option value="درآمد">درآمد</option>
                <option value="دارایی">دارایی</option>
            </select>
            <label>دسته اصلی (سطح ۱):</label>
            <input type="text" id="cat_category" placeholder="مثلاً اغذیه، مسکن..." required>
            <label>زیردسته (سطح ۲):</label>
            <input type="text" id="cat_subcategory" placeholder="مثلاً تنقلات، اجاره..." required>
            <button type="submit" class="btn-secondary">افزودن به درختواره</button>
            <button type="button" class="btn-cancel" onclick="closeModal('manageCategoryModal')">بستن</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://myqtpfdohayrhqmafqrj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6iFdGoWIvKrGKjfF_T-zXQ_-717yY63';
    let supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let activeSelectElement = null;
    let accountsList = [];
    let categoriesList = [];

    const defaultCategories = [
        { type: 'هزینه', category: 'اغذیه', subcategory: 'سوپرمارکت' },
        { type: 'هزینه', category: 'اغذیه', subcategory: 'تنقلات' },
        { type: 'هزینه', category: 'مسکن', subcategory: 'اجاره' },
        { type: 'هزینه', category: 'حمل و نقل', subcategory: 'اسنپ و تاکسی' },
        { type: 'درآمد', category: 'حقوق و دستمزد', subcategory: 'حقوق ثابت' }
    ];

    window.addEventListener('load', async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        handleSession(session);
        supabaseClient.auth.onAuthStateChange(async (event, session) => handleSession(session));
        updateNetworkStatus();
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
    });

    function toggleAuthMode(mode) {
        if (mode === 'signup') {
            document.getElementById('auth-title').innerText = 'ثبت‌نام کاربر جدید';
            document.getElementById('username-div').classList.remove('hidden');
            document.getElementById('login-buttons').classList.add('hidden');
            document.getElementById('signup-buttons').classList.remove('hidden');
        } else {
            document.getElementById('auth-title').innerText = 'ورود به سیستم';
            document.getElementById('username-div').classList.add('hidden');
            document.getElementById('login-buttons').classList.remove('hidden');
            document.getElementById('signup-buttons').classList.add('hidden');
        }
    }

    async function handleSession(session) {
        const authSection = document.getElementById('auth-section');
        const appSection = document.getElementById('app-section');
        if (session && session.user) {
            currentUser = session.user;
            authSection.classList.add('hidden');
            appSection.classList.remove('hidden');
            const username = currentUser.user_metadata?.username || currentUser.email;
            document.getElementById('user-info').innerText = `سلام، ${username} 👋`;
            setLocalDateTime();
            await loadAccounts();
            await loadCategories();
            await loadRecentCategories(); // بارگذاری دسته‌های اخیر بعد از ورود
            handleTransactionTypeChange(); 
        } else {
            currentUser = null;
            authSection.classList.remove('hidden');
            appSection.classList.add('hidden');
        }
    }

    // بارگذاری هوشمند ۸ دسته اخیر از تراکنش‌ها
    async function loadRecentCategories() {
        if (!currentUser) return;
        try {
            const { data, error } = await supabaseClient.from('transactions')
                .select('category_type, category_main, category_sub')
                .not('category_type', 'is', null)
                .order('transaction_date', { ascending: false })
                .limit(30);

            if (error) throw error;
            
            const wrapper = document.getElementById('recent_categories_wrapper');
            const container = document.getElementById('recent_categories_container');
            
            if (!data || data.length === 0) {
                wrapper.classList.add('hidden');
                return;
            }

            const uniqueCats = [];
            const seen = new Set();
            for (let tx of data) {
                const key = `${tx.category_type}|${tx.category_main}|${tx.category_sub}`;
                if (!seen.has(key)) {
                    seen.add(key);
                    uniqueCats.push(tx);
                    if (uniqueCats.length >= 6) break; // حداکثر ۶ دکمه میان‌بر
                }
            }

            container.innerHTML = '';
            uniqueCats.forEach(c => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'recent-chip';
                const icon = c.category_type === 'هزینه' ? '🔴' : (c.category_type === 'درآمد' ? '🟢' : '🔵');
                btn.innerHTML = `${icon} ${c.category_sub}`;
                btn.onclick = () => selectRecentCategory(c.category_type, c.category_main, c.category_sub);
                container.appendChild(btn);
            });
            wrapper.classList.remove('hidden');

        } catch (e) {
            console.error("خطا در بارگذاری دسته‌های اخیر:", e);
        }
    }

    // پر کردن خودکار فیلدهای آبشاری با انتخاب میان‌بر
    function selectRecentCategory(type, main, sub) {
        const typeSelect = document.getElementById('tx_cat_type');
        typeSelect.value = type;
        handleCatTypeChange(); 

        const mainSelect = document.getElementById('tx_cat_main');
        mainSelect.value = main;
        handleCatMainChange(); 

        const subSelect = document.getElementById('tx_cat_sub');
        subSelect.value = sub;
    }

    async function handleSignUp() {
        const username = document.getElementById('auth_username').value;
        const email = document.getElementById('auth_email').value;
        const password = document.getElementById('auth_password').value;
        if (!email || !password || !username) return alert('لطفاً تمامی فیلدها را پر کنید.');
        const { error } = await supabaseClient.auth.signUp({ email, password, options: { data: { username } } });
        if (error) alert('خطا: ' + error.message);
        else { alert('✅ ثبت‌نام موفق! وارد شوید.'); toggleAuthMode('login'); }
    }

    async function handleLogin() {
        const email = document.getElementById('auth_email').value;
        const password = document.getElementById('auth_password').value;
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) alert('❌ ایمیل یا رمز عبور اشتباه است.');
    }

    async function handleLogout() { await supabaseClient.auth.signOut(); }
    async function handleResetPassword() {
        const email = document.getElementById('auth_email').value;
        if (!email) return alert('ابتدا ایمیل را وارد کنید.');
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
        if (error) alert('❌ خطا: ' + error.message); else alert('📧 لینک بازیابی ارسال شد.');
    }

    function setLocalDateTime() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('transaction_date').value = now.toISOString().slice(0, 16);
    }

    function updateNetworkStatus() {
        const el = document.getElementById('network-status');
        if (navigator.onLine) { el.innerText = '🟢 متصل به سرور'; el.style.background = '#ecfdf5'; el.style.color = '#059669'; }
        else { el.innerText = '🔴 آفلاین'; el.style.background = '#fef2f2'; el.style.color = '#dc2626'; }
    }

    function handleTransactionTypeChange() {
        const type = document.getElementById('type').value;
        document.getElementById('singleAccountDiv').classList.toggle('hidden', type === 'انتقال موجودی');
        document.getElementById('transferDiv').classList.toggle('hidden', type !== 'انتقال موجودی');
        document.getElementById('categoryDiv').classList.toggle('hidden', type === 'انتقال موجودی');
        
        const txCatType = document.getElementById('tx_cat_type');
        if (type === 'پرداخت') { txCatType.value = 'هزینه'; handleCatTypeChange(); }
        else if (type === 'دریافت') { txCatType.value = 'درآمد'; handleCatTypeChange(); }
    }

    async function loadAccounts() {
        if (!currentUser) return;
        const { data } = await supabaseClient.from('accounts').select('*');
        accountsList = data || [];
        const pop = (el) => {
            const val = el.value;
            el.innerHTML = '<option value="">انتخاب حساب...</option>';
            accountsList.forEach(a => {
                const opt = document.createElement('option');
                opt.value = a.id; opt.innerText = `${a.name} - ${a.balance.toLocaleString()} تومان`; el.appendChild(opt);
            });
            const addOpt = document.createElement('option'); addOpt.value = 'ADD_NEW_ACCOUNT'; addOpt.innerText = '➕ افزودن حساب جدید...'; el.appendChild(addOpt);
            if (val && val !== 'ADD_NEW_ACCOUNT') el.value = val;
        };
        pop(document.getElementById('account_id')); pop(document.getElementById('from_account_id')); pop(document.getElementById('to_account_id'));
    }

    async function loadCategories() {
        if (!currentUser) return;
        const { data } = await supabaseClient.from('categories').select('*');
        
        if (!data || data.length === 0) {
            await supabaseClient.from('categories').insert(defaultCategories);
            return loadCategories(); 
        }

        categoriesList = data;
        handleCatTypeChange(); 
    }

    function handleCatTypeChange() {
        const type = document.getElementById('tx_cat_type').value;
        const mainContainer = document.getElementById('cat_main_container');
        const subContainer = document.getElementById('cat_sub_container');
        const mainSelect = document.getElementById('tx_cat_main');
        const subSelect = document.getElementById('tx_cat_sub');
        
        mainSelect.innerHTML = '<option value="">۲. انتخاب دسته اصلی...</option>';
        subSelect.innerHTML = '<option value="">۳. انتخاب زیردسته نهایی...</option>';
        
        if (!type) {
            mainContainer.classList.add('hidden');
            subContainer.classList.add('hidden');
            return;
        }
        
        const mains = [...new Set(categoriesList.filter(c => c.type === type).map(c => c.category))];
        mains.forEach(m => { mainSelect.innerHTML += `<option value="${m}">${m}</option>`; });
        
        mainContainer.classList.remove('hidden'); 
        subContainer.classList.add('hidden'); 
    }

    function handleCatMainChange() {
        const type = document.getElementById('tx_cat_type').value;
        const main = document.getElementById('tx_cat_main').value;
        const subContainer = document.getElementById('cat_sub_container');
        const subSelect = document.getElementById('tx_cat_sub');
        
        subSelect.innerHTML = '<option value="">۳. انتخاب زیردسته نهایی...</option>';
        
        if (!main) {
            subContainer.classList.add('hidden');
            return;
        }
        
        const subs = categoriesList.filter(c => c.type === type && c.category === main);
        subs.forEach(s => { subSelect.innerHTML += `<option value="${s.subcategory}">${s.subcategory}</option>`; });
        
        subContainer.classList.remove('hidden'); 
    }

    function openCategoryModal() {
        document.getElementById('manageCategoryModal').classList.remove('hidden');
        renderCategoryList();
    }

    function renderCategoryList() {
        const container = document.getElementById('category_list_container');
        container.innerHTML = '';
        
        const types = ['هزینه', 'درآمد', 'دارایی'];
        const typeIcons = {'هزینه': '🔴', 'درآمد': '🟢', 'دارایی': '🔵'};
        
        types.forEach(type => {
            const typeCats = categoriesList.filter(c => c.type === type);
            if (typeCats.length === 0) return;
            
            const typeDiv = document.createElement('div');
            typeDiv.className = 'tree-type';
            typeDiv.innerText = `${typeIcons[type]} ${type}‌ها`;
            container.appendChild(typeDiv);
            
            const mains = [...new Set(typeCats.map(c => c.category))];
            mains.forEach(main => {
                const mainDiv = document.createElement('div');
                mainDiv.className = 'tree-main';
                mainDiv.innerText = `📁 ${main}`;
                container.appendChild(mainDiv);
                
                const subs = typeCats.filter(c => c.category === main);
                subs.forEach(sub => {
                    const subDiv = document.createElement('div');
                    subDiv.className = 'tree-sub';
                    subDiv.innerHTML = `<span style="display:flex; align-items:center;">└─ 📄 &nbsp; ${sub.subcategory}</span> <span class="cat-delete" onclick="deleteCategory('${sub.id}')" title="حذف شاخه">✖</span>`;
                    container.appendChild(subDiv);
                });
            });
        });
    }

    async function deleteCategory(id) {
        if(!confirm('آیا از حذف این شاخه مطمئن هستید؟')) return;
        await supabaseClient.from('categories').delete().eq('id', id);
        await loadCategories();
        renderCategoryList();
    }

    document.getElementById('modalCategoryForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const type = document.getElementById('cat_type').value;
        const category = document.getElementById('cat_category').value;
        const subcategory = document.getElementById('cat_subcategory').value;
        
        await supabaseClient.from('categories').insert([{ type, category, subcategory }]);
        document.getElementById('modalCategoryForm').reset();
        await loadCategories();
        renderCategoryList();
    });

    function checkAddAccountSelection(el) {
        if (el.value === 'ADD_NEW_ACCOUNT') { activeSelectElement = el; document.getElementById('addAccountModal').classList.remove('hidden'); el.value = ''; }
    }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); activeSelectElement = null; }

    document.getElementById('modalAccountForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('modal_acc_name').value;
        const branch = document.getElementById('modal_acc_branch').value;
        const balance = parseFloat(document.getElementById('modal_acc_balance').value);
        const { data } = await supabaseClient.from('accounts').insert([{ name, branch, balance }]).select();
        alert('✅ حساب اضافه شد!');
        closeModal('addAccountModal');
        await loadAccounts();
        if (activeSelectElement) activeSelectElement.value = data[0].id;
    });

    document.getElementById('transactionForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const type = document.getElementById('type').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const date = document.getElementById('transaction_date').value;
        const desc = document.getElementById('description').value;

        let data = { type, amount, transaction_date: date, description: desc };
        
        if (type === 'انتقال موجودی') {
            const fromId = document.getElementById('from_account_id').value;
            const toId = document.getElementById('to_account_id').value;
            if (!fromId || !toId || fromId === toId) return alert('مبدا و مقصد نامعتبر است.');
            data.from_account_id = fromId; data.to_account_id = toId;
        } else {
            const accId = document.getElementById('account_id').value;
            const catType = document.getElementById('tx_cat_type').value;
            const catMain = document.getElementById('tx_cat_main').value;
            const catSub = document.getElementById('tx_cat_sub').value;
            
            if (!accId || !catType || !catMain || !catSub) return alert('لطفاً حساب بانکی و تمام سطوح دسته‌بندی را تا انتها انتخاب کنید.');
            
            data.account_id = accId;
            data.category_type = catType;
            data.category_main = catMain;
            data.category_sub = catSub;
        }

        const { error } = await supabaseClient.from('transactions').insert([data]);
        if(error) return alert('❌ خطا: ' + error.message);

        if (type === 'پرداخت' || type === 'دریافت') {
            const acc = accountsList.find(a => a.id === data.account_id);
            const newBal = type === 'پرداخت' ? parseFloat(acc.balance) - amount : parseFloat(acc.balance) + amount;
            await supabaseClient.from('accounts').update({ balance: newBal }).eq('id', data.account_id);
        } else if (type === 'انتقال موجودی') {
            const fAcc = accountsList.find(a => a.id === data.from_account_id);
            const tAcc = accountsList.find(a => a.id === data.to_account_id);
            await supabaseClient.from('accounts').update({ balance: parseFloat(fAcc.balance) - amount }).eq('id', data.from_account_id);
            await supabaseClient.from('accounts').update({ balance: parseFloat(tAcc.balance) + amount }).eq('id', data.to_account_id);
        }

        alert('✅ ثبت موفق!');
        document.getElementById('transactionForm').reset();
        setLocalDateTime(); 
        handleTransactionTypeChange(); 
        await loadAccounts();
        await loadRecentCategories(); // بروزرسانی میان‌برها پس از ثبت تراکنش جدید
    });
</script>

</body>
</html>
